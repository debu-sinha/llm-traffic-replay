<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 770" width="1520" height="770" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1520" height="770" fill="#ffffff"/>
<marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1971c2"/></marker>
<marker id="agreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f9e44"/></marker>
<marker id="agray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#495057"/></marker>
<text x="40" y="40" font-size="26" font-weight="700" fill="#1e1e1e">llm-traffic-replay architecture</text>

<!-- inputs -->
<rect x="40" y="70" width="190" height="70" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" stroke-dasharray="6 4"/>
<text x="135" y="96" font-size="15" font-weight="600" fill="#2f9e44" text-anchor="middle">your request logs</text>
<text x="135" y="113" font-size="11" fill="#2f9e44" text-anchor="middle">profile_from_logs.py</text>
<rect x="40" y="300" width="190" height="70" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" stroke-dasharray="6 4"/>
<text x="135" y="326" font-size="15" font-weight="600" fill="#2f9e44" text-anchor="middle">your arrival trace</text>
<text x="135" y="343" font-size="11" fill="#2f9e44" text-anchor="middle">timestamps_file</text>
<rect x="40" y="510" width="190" height="70" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="135" y="536" font-size="15" font-weight="600" fill="#495057" text-anchor="middle">run config (JSON)</text>
<text x="135" y="553" font-size="11" fill="#495057" text-anchor="middle">endpoint / seed / extra_body</text>
<rect x="40" y="620" width="190" height="64" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" stroke-dasharray="6 4"/>
<text x="135" y="646" font-size="15" font-weight="600" fill="#2f9e44" text-anchor="middle">your prompts</text>
<text x="135" y="663" font-size="11" fill="#2f9e44" text-anchor="middle">prompts_file (real text)</text>

<!-- generation column -->
<rect x="300" y="60" width="215" height="80" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text x="408" y="86" font-size="15" font-weight="600" fill="#1971c2" text-anchor="middle">profile.py</text>
<text x="408" y="103" font-size="11" fill="#1971c2" text-anchor="middle">quantiles -&gt; token plan</text>
<text x="408" y="118" font-size="11" fill="#1971c2" text-anchor="middle">(lognormal / logit-normal)</text>
<rect x="300" y="180" width="215" height="80" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text x="408" y="206" font-size="15" font-weight="600" fill="#1971c2" text-anchor="middle">prefix_pool.py</text>
<text x="408" y="223" font-size="11" fill="#1971c2" text-anchor="middle">shared-prefix docs,</text>
<text x="408" y="238" font-size="11" fill="#1971c2" text-anchor="middle">Zipf popularity</text>
<rect x="300" y="300" width="215" height="80" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text x="408" y="326" font-size="15" font-weight="600" fill="#1971c2" text-anchor="middle">textgen.py</text>
<text x="408" y="343" font-size="11" fill="#1971c2" text-anchor="middle">prefix + unique text,</text>
<text x="408" y="358" font-size="11" fill="#1971c2" text-anchor="middle">calibrated chars/token</text>
<rect x="300" y="480" width="215" height="80" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text x="408" y="506" font-size="15" font-weight="600" fill="#1971c2" text-anchor="middle">schedule.py</text>
<text x="408" y="523" font-size="11" fill="#1971c2" text-anchor="middle">bursty arrivals</text>
<text x="408" y="538" font-size="11" fill="#1971c2" text-anchor="middle">or your trace</text>

<!-- runner -->
<rect x="600" y="230" width="215" height="150" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text x="708" y="276" font-size="15" font-weight="600" fill="#1971c2" text-anchor="middle">runner.py</text>
<text x="708" y="295" font-size="11" fill="#1971c2" text-anchor="middle">calibration warmup,</text>
<text x="708" y="310" font-size="11" fill="#1971c2" text-anchor="middle">then paced dispatch</text>
<text x="708" y="325" font-size="11" fill="#1971c2" text-anchor="middle">(bounded thread pool)</text>
<text x="708" y="348" font-size="11" fill="#868e96" text-anchor="middle">warmup recalibrates cpt</text>

<!-- io column -->
<rect x="890" y="140" width="215" height="90" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text x="998" y="172" font-size="15" font-weight="600" fill="#1971c2" text-anchor="middle">client.py</text>
<text x="998" y="189" font-size="11" fill="#1971c2" text-anchor="middle">streaming HTTP: connect, ttft,</text>
<text x="998" y="204" font-size="11" fill="#1971c2" text-anchor="middle">ttfr, ttfv, interchunk max</text>
<rect x="890" y="420" width="215" height="90" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text x="998" y="452" font-size="15" font-weight="600" fill="#1971c2" text-anchor="middle">metrics.py</text>
<text x="998" y="469" font-size="11" fill="#1971c2" text-anchor="middle">percentiles, believability,</text>
<text x="998" y="484" font-size="11" fill="#1971c2" text-anchor="middle">SLA, cost, drift, sample</text>

<!-- sinks -->
<rect x="1245" y="140" width="230" height="90" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="1360" y="172" font-size="15" font-weight="600" fill="#495057" text-anchor="middle">endpoint</text>
<text x="1360" y="189" font-size="11" fill="#495057" text-anchor="middle">OpenAI-compatible chat</text>
<text x="1360" y="204" font-size="11" fill="#495057" text-anchor="middle">(Databricks PT / mock)</text>
<rect x="1245" y="420" width="230" height="90" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="1360" y="452" font-size="15" font-weight="600" fill="#495057" text-anchor="middle">results/</text>
<text x="1360" y="469" font-size="11" fill="#495057" text-anchor="middle">requests.jsonl / summary.json</text>
<text x="1360" y="484" font-size="11" fill="#495057" text-anchor="middle">/ report.md / report.html</text>
<rect x="1245" y="560" width="230" height="68" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="1360" y="586" font-size="15" font-weight="600" fill="#495057" text-anchor="middle">merge / compare</text>
<text x="1360" y="603" font-size="11" fill="#495057" text-anchor="middle">offline: pool shards,</text>
<text x="1360" y="618" font-size="11" fill="#495057" text-anchor="middle">compare providers</text>

<!-- connectors: all orthogonal, routed through empty lanes -->
<polyline points="230,100 300,100" fill="none" stroke="#2f9e44" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#agreen)"/>
<polyline points="230,335 255,335 255,520 300,520" fill="none" stroke="#2f9e44" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#agreen)"/>
<polyline points="230,545 280,545 280,610 575,610 575,355 600,355" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#agray)"/>
<polyline points="407,140 407,180" fill="none" stroke="#1971c2" stroke-width="1.6" marker-end="url(#ablue)"/>
<polyline points="407,260 407,300" fill="none" stroke="#1971c2" stroke-width="1.6" marker-end="url(#ablue)"/>
<polyline points="515,335 525,335 525,265 600,265" fill="none" stroke="#1971c2" stroke-width="1.6" marker-end="url(#ablue)"/>
<polyline points="515,520 545,520 545,310 600,310" fill="none" stroke="#1971c2" stroke-width="1.6" marker-end="url(#ablue)"/>
<polyline points="815,290 850,290 850,185 890,185" fill="none" stroke="#1971c2" stroke-width="1.6" marker-end="url(#ablue)"/>
<polyline points="1105,180 1245,180" fill="none" stroke="#1971c2" stroke-width="1.6" marker-end="url(#ablue)"/>
<polyline points="1245,205 1105,205" fill="none" stroke="#495057" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#agray)"/>
<polyline points="997,230 997,420" fill="none" stroke="#1971c2" stroke-width="1.6" marker-end="url(#ablue)"/>
<polyline points="1105,465 1245,465" fill="none" stroke="#1971c2" stroke-width="1.6" marker-end="url(#ablue)"/>
<polyline points="1360,510 1360,560" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#agray)"/>
<polyline points="230,652 720,652 720,380" fill="none" stroke="#2f9e44" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#agreen)"/>

<!-- edge labels, each in an empty lane -->
<text x="413" y="156" font-size="11" fill="#1971c2">prefix tokens</text>
<text x="413" y="284" font-size="11" fill="#1971c2">doc id + cut</text>
<text x="530" y="258" font-size="11" fill="#1971c2">messages</text>
<text x="551" y="420" font-size="11" fill="#1971c2">arrivals</text>
<text x="392" y="604" font-size="11" fill="#495057">config</text>
<text x="856" y="245" font-size="11" fill="#1971c2">paced submit</text>
<text x="1150" y="172" font-size="11" fill="#1971c2">POST</text>
<text x="1138" y="223" font-size="11" fill="#495057">SSE + usage</text>
<text x="1002" y="330" font-size="11" fill="#1971c2">timings + usage</text>
<text x="1160" y="457" font-size="11" fill="#1971c2">write</text>
<text x="300" y="646" font-size="11" fill="#2f9e44">real text (prompts mode)</text>

<!-- legend -->
<text x="40" y="730" font-size="12" fill="#495057">green dashed = bring-your-own-data inputs (logs and trace feed generation, prompts go straight to the runner)</text>
<text x="40" y="748" font-size="12" fill="#495057">gray dashed = endpoint return (SSE, usage)     gray solid = offline aggregation</text>
</svg>
