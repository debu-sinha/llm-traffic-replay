[project]
name = "llm-traffic-replay"
version = "0.7.0"
description = "Replay production-derived or explicitly synthetic LLM traffic shapes with cache-eligible prefix reuse and evidence-qualified measurement."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
authors = [
  {name = "Debu Sinha", email = "debusinha2009@gmail.com"},
]

[project.urls]
Homepage = "https://github.com/debu-sinha/llm-traffic-replay"
Repository = "https://github.com/debu-sinha/llm-traffic-replay.git"
Issues = "https://github.com/debu-sinha/llm-traffic-replay/issues"

[project.scripts]
traffic-replay = "traffic_replay.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["traffic_replay*", "scripts*"]

[tool.setuptools.package-data]
traffic_replay = ["data/*.json", "_build_provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
