<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Workload and open-loop load model</title>
  <desc id="desc">Real prompts or profile schemas create request bodies. A synthetic burst schedule or shifted arrival trace creates monotonic target times. Fixed-rate and trace schedules can be materialized before network access; a sizing-derived schedule is the explicit exception because paid sizing must derive its rate first. Global indices are assigned before sharding. A bounded open-loop dispatcher offers request operations. Immediately before every physical inference POST, one command-local no-wait guard atomically reserves query, token, and exact serialized-byte budget; a local denial sends no POST. The built-in transport opens a fresh HTTP/1.1 connection for each admitted physical attempt. Achieved token, cache, rate, concurrency, response identity, runtime admission, and the normalized post-drain endpoint-stability subset are measured rather than assumed. The report has exactly five canonical decisions; identity, stability, and admission are evidence gates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .bg{fill:#f8fafc}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2}.amber{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.h{font:700 21px system-ui,sans-serif;fill:#0f172a}.t{font:700 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#334155}.note{font:italic 12px system-ui,sans-serif;fill:#475569}.a{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="650"/>
  <text class="h" x="35" y="42">Workload intent becomes offered load; achieved work is measured separately</text>

  <rect class="box" x="45" y="70" width="260" height="175" rx="12"/>
  <text class="t" x="175" y="98" text-anchor="middle">Workload input: exactly one</text>
  <text class="s" x="65" y="126">Real prompts:</text>
  <text class="s" x="80" y="148">approved string content</text>
  <text class="s" x="80" y="169">replayed as supplied</text>
  <text class="s" x="65" y="197">Profile:</text>
  <text class="s" x="80" y="219">v1 p50/p95 or v2 fidelity modes</text>

  <rect class="green" x="360" y="70" width="310" height="175" rx="12"/>
  <text class="t" x="515" y="98" text-anchor="middle">Profile sampling choices</text>
  <text class="s" x="380" y="126">v1: independent fitted marginals</text>
  <text class="s" x="380" y="150">v2 quantile_cdf:</text>
  <text class="s" x="395" y="171">full marginal knot ladder, stratified ranks</text>
  <text class="s" x="395" y="192">independent cross-field pairing, clamped tails</text>
  <text class="s" x="380" y="216">v2 empirical_joint: weighted observed triples</text>

  <rect class="amber" x="725" y="85" width="235" height="145" rx="12"/>
  <text class="t" x="842" y="113" text-anchor="middle">Request construction</text>
  <text class="s" x="745" y="137">sampled input/output budgets</text>
  <text class="s" x="745" y="156">shared prefix + unique suffix</text>
  <text class="s" x="745" y="175">intended cache fraction</text>
  <text class="s" x="745" y="194">= prefix / target input tokens</text>
  <text class="s" x="745" y="213">never a request hit probability</text>

  <rect class="gray" x="1015" y="85" width="220" height="145" rx="12"/>
  <text class="t" x="1125" y="113" text-anchor="middle">Request body plan</text>
  <text class="s" x="1035" y="141">messages + max_tokens</text>
  <text class="s" x="1035" y="165">fixed seed and global request ID</text>
  <text class="s" x="1035" y="189">model-specific extra_body</text>
  <text class="s" x="1035" y="213">exact bytes; provider contract required</text>
  <path class="a" d="M305 158 H360"/><path class="a" d="M670 158 H725"/><path class="a" d="M960 158 H1015"/>
  <text class="note" x="515" y="265" text-anchor="middle">Real-prompts mode bypasses profile sampling and synthetic text construction.</text>

  <rect class="box" x="45" y="325" width="260" height="120" rx="12"/>
  <text class="t" x="175" y="353" text-anchor="middle">Arrival input: exactly one path</text>
  <text class="s" x="65" y="382">Seeded two-state Poisson schedule</text>
  <text class="s" x="65" y="405">or finite timestamps: sort + shift to 0</text>
  <text class="s" x="65" y="428">duration_s caps shifted trace rows</text>

  <rect class="violet" x="360" y="325" width="260" height="120" rx="12"/>
  <text class="t" x="490" y="353" text-anchor="middle">Global schedule identity</text>
  <text class="s" x="380" y="382">assign global index before split</text>
  <text class="s" x="380" y="405">SHA-256 of binary timestamp sequence</text>
  <text class="s" x="380" y="428">round-robin modulo shard selection</text>

  <rect class="green" x="675" y="310" width="280" height="150" rx="12"/>
  <text class="t" x="815" y="334" text-anchor="middle">Open-loop dispatch</text>
  <text class="t" x="815" y="353" text-anchor="middle">+ fresh HTTP/1.1 POST admission</text>
  <text class="s" x="695" y="378">fixed targets; bounded workers + pending</text>
  <text class="s" x="695" y="399">one no-wait guard spans the command</text>
  <text class="s" x="695" y="420">reserve QPS/QPH, TPM, exact bytes</text>
  <text class="s" x="695" y="441">local denial sends no POST; stop ladder</text>

  <rect class="amber" x="1015" y="310" width="220" height="150" rx="12"/>
  <text class="t" x="1125" y="338" text-anchor="middle">Endpoint outcomes</text>
  <text class="s" x="1035" y="367">service time changes occupancy</text>
  <text class="s" x="1035" y="390">provider 429/errors can shed work</text>
  <text class="s" x="1035" y="413">usage/cache fields can be missing</text>
  <text class="s" x="1035" y="436">retries can add physical POSTs</text>
  <path class="a" d="M305 385 H360"/><path class="a" d="M620 385 H675"/><path class="a" d="M955 385 H1015"/>

  <rect class="violet" x="235" y="515" width="810" height="92" rx="12"/>
  <text class="t" x="640" y="544" text-anchor="middle">Measured evidence feeds exactly five canonical decisions</text>
  <text class="s" x="640" y="569" text-anchor="middle">delivered rate and queue wait | observed in-flight concurrency | prompt/output token coverage</text>
  <text class="s" x="640" y="591" text-anchor="middle">cached fraction | answer outcomes | caller latency | identity / stability / admission evidence gates</text>
  <path class="a" d="M815 460 V492 H640 V515"/>
  <text class="note" x="640" y="632" text-anchor="middle">A fixed seed reproduces the client plan, not endpoint timing, autoscaling, cache state, or network conditions.</text>
</svg>
