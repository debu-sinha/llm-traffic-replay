<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">LLM traffic replay architecture and evidence lifecycle</title>
  <desc id="desc">Private input capture and exact local prevalidation precede credential and network access. Fixed-rate, trace, and every sweep-rung schedule are materialized at that boundary; a sizing-derived schedule is the explicit exception because paid sizing must derive its rate first. When quota limits are configured, conservative full-request-body planning and positive READY endpoint binding precede paid inference. A crash-visible setup artifact is claimed before the default two-request preflight. One command-local no-wait guard atomically admits every physical inference POST immediately before the request call; retries and fallbacks are admitted separately. A versioned endpoint adapter serializes the request, declares request and accepted response media plus framing, folds provider events into canonical state, normalizes usage, and classifies the terminal outcome. The built-in fresh HTTP/1.1 transport is a separate boundary and opens one connection for every physical attempt. Failed and partial attempts remain in reliability and occupancy evidence; primary latency requires clean acceptable outcomes, while token metrics require clean rows with trustworthy usage and explicit coverage. Request-path and caller clocks, response model plus Databricks served-model-name identity, runtime-admission events, and a normalized subset of pre-run and post-drain endpoint metadata feed a durable journal and exactly five canonical report decisions; identity, stability, and runtime admission are evidence gates. Manifest version 3 and a completion marker are promoted last.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="warnArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b45309"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.lane{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.safe{fill:#ecfdf5;stroke:#059669;stroke-width:2}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.evidence{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.muted{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.h{font:700 21px system-ui,sans-serif;fill:#0f172a}.lh{font:700 16px system-ui,sans-serif;fill:#334155}.t{font:600 14px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#334155}.tiny{font:11px system-ui,sans-serif;fill:#475569}.arrow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#b45309;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#warnArrow)}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1440" height="820"/>
  <text class="h" x="36" y="42">llm-traffic-replay: bounded traffic, explicit clocks, sealed evidence</text>

  <rect class="lane" x="28" y="65" width="1384" height="150" rx="16"/>
  <text class="lh" x="48" y="91">1. Freeze and validate exact inputs before credential, network, or inference access</text>
  <rect class="safe" x="55" y="112" width="205" height="72" rx="10"/>
  <text class="t" x="157" y="134" text-anchor="middle">External workload inputs</text>
  <text class="s" x="157" y="155" text-anchor="middle">profile/prompts + optional trace</text>
  <text class="s" x="157" y="174" text-anchor="middle">durable paths read once</text>
  <rect class="box" x="315" y="112" width="190" height="72" rx="10"/>
  <text class="t" x="410" y="133" text-anchor="middle">Freeze + prevalidate</text>
  <text class="s" x="410" y="154" text-anchor="middle">private bytes; SHA-256 + size</text>
  <text class="tiny" x="410" y="174" text-anchor="middle">fixed/trace schedules; sizing waits</text>
  <rect class="warn" x="560" y="104" width="260" height="88" rx="10"/>
  <text class="t" x="690" y="132" text-anchor="middle">Optional quota + READY P2T gate</text>
  <text class="s" x="690" y="154" text-anchor="middle">full JSON bytes + framing</text>
  <text class="s" x="690" y="174" text-anchor="middle">synthetic: CPT max(configured,12); prompts: exact bytes</text>
  <rect class="evidence" x="875" y="104" width="235" height="88" rx="10"/>
  <text class="t" x="992" y="132" text-anchor="middle">Setup evidence claimed first</text>
  <text class="s" x="992" y="154" text-anchor="middle">sibling writing marker + start.json</text>
  <text class="s" x="992" y="174" text-anchor="middle">row sink fsyncs each paid outcome</text>
  <rect class="evidence" x="1165" y="104" width="210" height="88" rx="10"/>
  <text class="t" x="1270" y="132" text-anchor="middle">Billable preflight</text>
  <text class="s" x="1270" y="154" text-anchor="middle">2 representatives + explicit probes</text>
  <text class="s" x="1270" y="174" text-anchor="middle">refusal seals no performance result</text>
  <path class="arrow" d="M260 148 H315"/><path class="arrow" d="M505 148 H560"/><path class="arrow" d="M820 148 H875"/><path class="arrow" d="M1110 148 H1165"/>

  <rect class="lane" x="28" y="235" width="1384" height="245" rx="16"/>
  <text class="lh" x="48" y="263">2. Prepare and dispatch a bounded open-loop workload</text>
  <rect class="box" x="48" y="292" width="170" height="126" rx="10"/>
  <text class="t" x="133" y="318" text-anchor="middle">Workload plan</text>
  <text class="s" x="133" y="342" text-anchor="middle">profile or prompts</text>
  <text class="s" x="133" y="363" text-anchor="middle">schedule or trace</text>
  <text class="s" x="133" y="384" text-anchor="middle">global ID → shard</text>
  <text class="tiny" x="133" y="405" text-anchor="middle">sizing/calibration extra</text>
  <rect class="box" x="248" y="292" width="170" height="126" rx="10"/>
  <text class="t" x="333" y="318" text-anchor="middle">Open-loop dispatch</text>
  <text class="s" x="333" y="342" text-anchor="middle">monotonic targets</text>
  <text class="s" x="333" y="363" text-anchor="middle">bounded workers</text>
  <text class="s" x="333" y="384" text-anchor="middle">bounded pending</text>
  <text class="tiny" x="333" y="405" text-anchor="middle">caller clock retained</text>
  <rect class="safe" x="448" y="284" width="265" height="142" rx="10"/>
  <text class="t" x="580" y="308" text-anchor="middle">Versioned endpoint adapter</text>
  <text class="s" x="580" y="333" text-anchor="middle">exact request serialization</text>
  <text class="s" x="580" y="354" text-anchor="middle">declared media + framing</text>
  <text class="s" x="580" y="375" text-anchor="middle">canonical event fold</text>
  <text class="s" x="580" y="396" text-anchor="middle">outcome + normalized usage</text>
  <text class="tiny" x="580" y="417" text-anchor="middle">adapter ID + implementation hash sealed</text>
  <rect class="box" x="743" y="292" width="170" height="126" rx="10"/>
  <text class="t" x="828" y="318" text-anchor="middle">Fresh HTTP/1.1</text>
  <text class="s" x="828" y="342" text-anchor="middle">transport boundary</text>
  <text class="s" x="828" y="363" text-anchor="middle">one connection per</text>
  <text class="s" x="828" y="382" text-anchor="middle">physical attempt</text>
  <text class="tiny" x="828" y="405" text-anchor="middle">bounded response chunks</text>
  <rect class="warn" x="943" y="292" width="205" height="126" rx="10"/>
  <text class="t" x="1045" y="318" text-anchor="middle">Runtime admission</text>
  <text class="s" x="1045" y="342" text-anchor="middle">after connect; before POST</text>
  <text class="s" x="1045" y="363" text-anchor="middle">reserve exact body bytes</text>
  <text class="s" x="1045" y="384" text-anchor="middle">denial sends no POST</text>
  <text class="tiny" x="1045" y="405" text-anchor="middle">every retry re-admitted</text>
  <rect class="muted" x="1178" y="292" width="185" height="126" rx="10"/>
  <text class="t" x="1270" y="318" text-anchor="middle">Serving endpoint</text>
  <text class="s" x="1270" y="342" text-anchor="middle">provider wire dialect</text>
  <text class="s" x="1270" y="363" text-anchor="middle">quota + response media</text>
  <text class="s" x="1270" y="384" text-anchor="middle">usage may be absent</text>
  <text class="tiny" x="1270" y="405" text-anchor="middle">quality remains external</text>
  <path class="arrow" d="M218 355 H248"/><path class="arrow" d="M418 355 H448"/><path class="arrow" d="M713 355 H743"/><path class="arrow" d="M913 355 H943"/><path class="arrow" d="M1148 355 H1178"/>
  <path class="dash" d="M1270 418 C1270 458 580 458 580 428"/>
  <text class="tiny" x="925" y="468" text-anchor="middle">response bytes return through transport; adapter validates framing and folds events</text>

  <rect class="lane" x="28" y="500" width="1384" height="135" rx="16"/>
  <text class="lh" x="48" y="528">3. Keep both timing families and journal every observed outcome</text>
  <rect class="box" x="80" y="550" width="315" height="58" rx="10"/>
  <text class="t" x="237" y="574" text-anchor="middle">Final-attempt request-path clocks</text>
  <text class="s" x="237" y="594" text-anchor="middle">upload/network included; probe never subtracted</text>
  <rect class="safe" x="465" y="550" width="360" height="58" rx="10"/>
  <text class="t" x="645" y="574" text-anchor="middle">Exact caller clocks from scheduled target</text>
  <text class="s" x="645" y="594" text-anchor="middle">queue + connect + fallback + refresh + retries + response</text>
  <rect class="evidence" x="895" y="550" width="430" height="58" rx="10"/>
  <text class="t" x="1110" y="574" text-anchor="middle">Durable requests.jsonl.partial</text>
  <text class="s" x="1110" y="592" text-anchor="middle">failures remain in reliability + occupancy evidence</text>
  <text class="tiny" x="1110" y="606" text-anchor="middle">latency needs acceptable outcomes; tokens need trustworthy usage</text>
  <path class="arrow" d="M395 579 H465"/><path class="arrow" d="M825 579 H895"/>

  <rect class="lane" x="28" y="655" width="1384" height="132" rx="16"/>
  <text class="lh" x="48" y="683">4. Re-snapshot the endpoint after traffic drains, then seal evidence</text>
  <rect class="evidence" x="70" y="704" width="250" height="55" rx="10"/>
  <text class="t" x="195" y="728" text-anchor="middle">Post-drain endpoint snapshot</text>
  <text class="s" x="195" y="748" text-anchor="middle">normalized-subset change invalidates claim</text>
  <rect class="evidence" x="370" y="704" width="255" height="55" rx="10"/>
  <text class="t" x="497" y="728" text-anchor="middle">requests + summary + reports</text>
  <text class="s" x="497" y="748" text-anchor="middle">five decisions + evidence gates</text>
  <rect class="evidence" x="675" y="704" width="275" height="55" rx="10"/>
  <text class="t" x="812" y="728" text-anchor="middle">manifest schema v3 last</text>
  <text class="s" x="812" y="748" text-anchor="middle">identity + SHA-256 + bytes + row count</text>
  <rect class="safe" x="1000" y="704" width="335" height="55" rx="10"/>
  <text class="t" x="1167" y="728" text-anchor="middle">.traffic-replay-complete promoted last</text>
  <text class="s" x="1167" y="748" text-anchor="middle">merge/compare require sealed, internally hash-verified inputs</text>
  <path class="arrow" d="M320 731 H370"/><path class="arrow" d="M625 731 H675"/><path class="arrow" d="M950 731 H1000"/>
</svg>
