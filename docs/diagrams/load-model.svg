<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Workload, adapter, transport, and open-loop load model</title>
  <desc id="desc">Real prompts or profile schemas create logical request plans. The selected versioned endpoint adapter serializes exact request bytes, declares request and accepted response media types plus framing, folds provider events into canonical state, normalizes usage, and classifies the terminal outcome. The adapter is separate from the built-in transport, which opens a fresh HTTP/1.1 connection for each physical attempt. A synthetic burst schedule or shifted arrival trace creates monotonic target times; fixed-rate and trace schedules can be materialized before network access, while a sizing-derived schedule is the explicit exception because paid sizing must derive its rate first. Global indices are assigned before sharding. A bounded open-loop dispatcher offers logical requests. After connection setup and immediately before every physical inference POST, one command-local no-wait guard atomically reserves query, token, and exact serialized-byte budget; a local denial sends no POST. Failed and partial attempts remain in reliability and occupancy evidence; primary latency requires clean acceptable outcomes, while token metrics require clean rows with trustworthy usage and explicit coverage. Achieved token, cache, rate, concurrency, response identity, runtime admission, and normalized endpoint stability are measured rather than assumed.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .bg{fill:#f8fafc}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2}.amber{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.h{font:700 21px system-ui,sans-serif;fill:#0f172a}.t{font:700 15px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#334155}.note{font:italic 12px system-ui,sans-serif;fill:#475569}.a{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1440" height="720"/>
  <text class="h" x="35" y="42">Workload intent becomes offered load; achieved work is measured separately</text>

  <rect class="box" x="35" y="70" width="230" height="190" rx="12"/>
  <text class="t" x="150" y="98" text-anchor="middle">Workload input: exactly one</text>
  <text class="s" x="55" y="128">Real prompts:</text>
  <text class="s" x="70" y="150">approved string content</text>
  <text class="s" x="70" y="172">replayed as supplied</text>
  <text class="s" x="55" y="202">Profile:</text>
  <text class="s" x="70" y="224">v1 p50/p95 or v2 fidelity modes</text>

  <rect class="green" x="300" y="70" width="290" height="190" rx="12"/>
  <text class="t" x="445" y="98" text-anchor="middle">Profile sampling choices</text>
  <text class="s" x="320" y="128">v1: independent fitted marginals</text>
  <text class="s" x="320" y="152">v2 quantile_cdf:</text>
  <text class="s" x="335" y="174">full marginal knot ladder</text>
  <text class="s" x="335" y="196">independent cross-field pairing</text>
  <text class="s" x="320" y="224">v2 empirical_joint: observed triples</text>

  <rect class="amber" x="625" y="70" width="225" height="190" rx="12"/>
  <text class="t" x="737" y="98" text-anchor="middle">Logical request plan</text>
  <text class="s" x="645" y="128">input/output budgets</text>
  <text class="s" x="645" y="150">shared prefix + unique suffix</text>
  <text class="s" x="645" y="172">intended cache fraction</text>
  <text class="s" x="645" y="194">= prefix / target input tokens</text>
  <text class="s" x="645" y="224">not a request hit probability</text>

  <rect class="violet" x="885" y="62" width="520" height="206" rx="12"/>
  <text class="t" x="1145" y="90" text-anchor="middle">Versioned endpoint adapter boundary</text>
  <text class="s" x="1145" y="119" text-anchor="middle">serialize the exact request bytes and adapter-owned fields</text>
  <text class="s" x="1145" y="143" text-anchor="middle">declare request media, accepted response media, and response framing</text>
  <text class="s" x="1145" y="167" text-anchor="middle">fold provider events into canonical content-free state</text>
  <text class="s" x="1145" y="191" text-anchor="middle">normalize usage and classify terminal/output outcome</text>
  <text class="s" x="1145" y="215" text-anchor="middle">seal adapter ID, contract, and implementation SHA-256</text>
  <text class="note" x="1145" y="243" text-anchor="middle">A new model reuses a compatible adapter; a new wire dialect needs a new version.</text>
  <path class="a" d="M265 165 H300"/><path class="a" d="M590 165 H625"/><path class="a" d="M850 165 H885"/>
  <text class="note" x="445" y="292" text-anchor="middle">Real-prompts mode bypasses profile sampling and synthetic text construction.</text>

  <rect class="box" x="35" y="340" width="205" height="150" rx="12"/>
  <text class="t" x="137" y="368" text-anchor="middle">Arrival input</text>
  <text class="s" x="55" y="397">Seeded two-state Poisson</text>
  <text class="s" x="55" y="420">or finite timestamps</text>
  <text class="s" x="55" y="443">sort + shift trace to zero</text>
  <text class="s" x="55" y="466">duration caps shifted rows</text>

  <rect class="violet" x="265" y="340" width="210" height="150" rx="12"/>
  <text class="t" x="370" y="368" text-anchor="middle">Global schedule</text>
  <text class="s" x="285" y="397">global index before split</text>
  <text class="s" x="285" y="420">binary timestamp SHA-256</text>
  <text class="s" x="285" y="443">round-robin shard subset</text>
  <text class="s" x="285" y="466">monotonic target times</text>

  <rect class="green" x="500" y="340" width="190" height="150" rx="12"/>
  <text class="t" x="595" y="368" text-anchor="middle">Open-loop dispatch</text>
  <text class="s" x="520" y="397">fixed target times</text>
  <text class="s" x="520" y="420">bounded workers</text>
  <text class="s" x="520" y="443">bounded pending queue</text>
  <text class="s" x="520" y="466">delivery measured</text>

  <rect class="box" x="715" y="340" width="180" height="150" rx="12"/>
  <text class="t" x="805" y="368" text-anchor="middle">Fresh HTTP/1.1</text>
  <text class="s" x="735" y="397">transport boundary</text>
  <text class="s" x="735" y="420">connect before admission</text>
  <text class="s" x="735" y="443">one connection per</text>
  <text class="s" x="735" y="466">physical attempt</text>

  <rect class="amber" x="920" y="340" width="220" height="150" rx="12"/>
  <text class="t" x="1030" y="368" text-anchor="middle">Runtime admission</text>
  <text class="s" x="940" y="397">immediately before POST</text>
  <text class="s" x="940" y="420">reserve QPS/QPH + tokens</text>
  <text class="s" x="940" y="443">reserve exact serialized bytes</text>
  <text class="s" x="940" y="466">denial sends no POST</text>

  <rect class="gray" x="1165" y="332" width="240" height="166" rx="12"/>
  <text class="t" x="1285" y="360" text-anchor="middle">Endpoint outcomes</text>
  <text class="s" x="1185" y="389">service time changes occupancy</text>
  <text class="s" x="1185" y="412">429/errors may shed work</text>
  <text class="s" x="1185" y="435">retries add physical attempts</text>
  <text class="s" x="1185" y="458">failures stay in reliability</text>
  <text class="s" x="1185" y="481">and occupancy evidence</text>
  <path class="a" d="M240 415 H265"/><path class="a" d="M475 415 H500"/><path class="a" d="M690 415 H715"/><path class="a" d="M895 415 H920"/><path class="a" d="M1140 415 H1165"/>
  <path class="a" d="M1145 268 V305 H595 V340"/>

  <rect class="violet" x="185" y="550" width="1070" height="112" rx="12"/>
  <text class="t" x="720" y="579" text-anchor="middle">Measured evidence feeds exactly five canonical decisions</text>
  <text class="s" x="720" y="604" text-anchor="middle">delivered rate + queue wait | observed in-flight occupancy | prompt/output/cache coverage | response identity</text>
  <text class="s" x="720" y="627" text-anchor="middle">failures stay in reliability/occupancy; latency needs acceptable outcomes; tokens need trustworthy usage</text>
  <text class="s" x="720" y="650" text-anchor="middle">caller latency | endpoint stability | runtime-admission evidence gates</text>
  <path class="a" d="M1285 498 V525 H720 V550"/>
  <text class="note" x="720" y="698" text-anchor="middle">A fixed seed reproduces the client plan, not endpoint timing, autoscaling, cache state, or network conditions.</text>
</svg>
