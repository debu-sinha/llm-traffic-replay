[project]
name = "llm-traffic-replay"
version = "0.4.1"
description = "Replay your production traffic shape against an LLM serving endpoint: heavy-tailed prompt sizes, constructed prompt-cache hit ratios, bursty arrivals, honest measurement."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["traffic_replay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
