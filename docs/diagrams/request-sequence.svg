<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Logical request, physical attempts, and timing clocks</title>
  <desc id="desc">A scheduled logical request waits for a worker, connects, posts, and consumes an SSE stream. An optional compatibility, credential, or transport path can create another physical POST. Final-attempt service clocks and exact caller clocks use different start points. The completed row is appended to a durable journal.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="warnArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
    <style>
      .bg{fill:#f8fafc}.head{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.life{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 5}.msg{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.ret{stroke:#334155;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow)}.warn{fill:none;stroke:#b45309;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#warnArrow)}.caller{fill:#ecfdf5;stroke:#059669;stroke-width:2}.service{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.journal{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.h{font:700 21px system-ui,sans-serif;fill:#0f172a}.t{font:700 14px system-ui,sans-serif;fill:#0f172a}.s{font:12px system-ui,sans-serif;fill:#334155}.tiny{font:11px system-ui,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect class="bg" width="1320" height="760"/>
  <text class="h" x="35" y="40">One logical row can contain more than one physical inference attempt</text>

  <rect class="head" x="35" y="70" width="190" height="48" rx="8"/><text class="t" x="130" y="100" text-anchor="middle">Open-loop dispatcher</text>
  <rect class="head" x="285" y="70" width="190" height="48" rx="8"/><text class="t" x="380" y="100" text-anchor="middle">Bounded worker</text>
  <rect class="head" x="535" y="70" width="190" height="48" rx="8"/><text class="t" x="630" y="100" text-anchor="middle">Connection + HTTP</text>
  <rect class="head" x="785" y="70" width="190" height="48" rx="8"/><text class="t" x="880" y="100" text-anchor="middle">Serving endpoint</text>
  <rect class="head" x="1035" y="70" width="220" height="48" rx="8"/><text class="t" x="1145" y="100" text-anchor="middle">Parser + journal</text>
  <line class="life" x1="130" y1="118" x2="130" y2="610"/><line class="life" x1="380" y1="118" x2="380" y2="610"/><line class="life" x1="630" y1="118" x2="630" y2="610"/><line class="life" x1="880" y1="118" x2="880" y2="610"/><line class="life" x1="1145" y1="118" x2="1145" y2="610"/>

  <circle cx="130" cy="150" r="5" fill="#059669"/><text class="s" x="145" y="154">scheduled monotonic target</text>
  <line class="msg" x1="130" y1="185" x2="380" y2="185"/><text class="s" x="255" y="177" text-anchor="middle">submit if pending bound has room</text>
  <text class="tiny" x="395" y="207">worker start: queue_wait_ms</text>
  <line class="msg" x1="380" y1="230" x2="630" y2="230"/><text class="s" x="505" y="222" text-anchor="middle">connect()</text>
  <line class="ret" x1="630" y1="260" x2="380" y2="260"/><text class="s" x="505" y="252" text-anchor="middle">DNS + TCP + TLS complete: connect_ms</text>
  <line class="msg" x1="380" y1="300" x2="630" y2="300"/><text class="s" x="505" y="292" text-anchor="middle">begin final-attempt clock; increment request_attempts</text>
  <line class="msg" x1="630" y1="330" x2="880" y2="330"/><text class="s" x="755" y="322" text-anchor="middle">POST streamed request</text>

  <path class="warn" d="M880 360 C970 390 970 430 880 450"/>
  <text class="s" x="985" y="391">400 explicitly rejects usage option,</text>
  <text class="s" x="985" y="409">qualifying auth expiry, or configured</text>
  <text class="s" x="985" y="427">transport retry: another physical POST</text>
  <text class="tiny" x="985" y="445">possible duplicate inference and billing</text>

  <line class="ret" x1="880" y1="480" x2="630" y2="480"/><text class="s" x="755" y="472" text-anchor="middle">SSE response lines</text>
  <line class="msg" x1="630" y1="510" x2="1145" y2="510"/><text class="s" x="887" y="502" text-anchor="middle">first response line; content/tool events; [DONE] or EOF ends E2E</text>
  <line class="ret" x1="1145" y1="550" x2="380" y2="550"/><text class="s" x="762" y="542" text-anchor="middle">structural outcome + timings + attempt evidence</text>
  <line class="msg" x1="380" y1="585" x2="1145" y2="585"/><text class="s" x="762" y="577" text-anchor="middle">append redacted result to requests.jsonl.partial</text>

  <rect class="caller" x="45" y="635" width="570" height="88" rx="10"/>
  <text class="t" x="330" y="660" text-anchor="middle">Exact caller clocks: scheduled target to observed event</text>
  <text class="s" x="330" y="683" text-anchor="middle">include worker queue + connection + fallback/refresh/retry + request + stream</text>
  <text class="s" x="330" y="704" text-anchor="middle">SLA scoring prefers caller timing when the scored population has coverage</text>
  <rect class="service" x="655" y="635" width="620" height="88" rx="10"/>
  <text class="t" x="965" y="660" text-anchor="middle">Final-attempt service clocks: immediately before POST to observed event</text>
  <text class="s" x="965" y="683" text-anchor="middle">exclude final connection setup; include upload, network/edge, endpoint work, and response transit</text>
  <text class="s" x="965" y="704" text-anchor="middle">diagnostic endpoint path time, not pure server compute and not exactly-once work</text>
</svg>
